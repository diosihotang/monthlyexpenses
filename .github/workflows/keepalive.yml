# Uptime check + keep-alive.
# Memanggil /api/health di production setiap 2 hari. Endpoint itu menjalankan query ke database,
# jadi project Supabase (paket gratis) tidak dianggap idle dan tidak otomatis di-pause.
# Kalau aplikasi atau database down, job ini gagal dan GitHub mengirim email notifikasi.
name: Keep-alive health check

on:
  schedule:
    - cron: '0 1 */2 * *' # 01:00 UTC (08:00 WIB), setiap 2 hari
  workflow_dispatch: # bisa dijalankan manual dari tab Actions

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HEALTH_URL: https://monthlyexpenses-iota.vercel.app/api/health
    steps:
      - name: Ping production health endpoint
        run: |
          # Retry supaya cold start serverless atau gangguan jaringan sesaat tidak dianggap down
          response=$(curl -sf --retry 3 --retry-delay 15 --retry-all-errors --max-time 30 "$HEALTH_URL")
          echo "$response"
          echo "$response" | grep -q '"database":"up"'
